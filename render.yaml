# Render Blueprint — one-click deploy of the SPI Marketing Pulse dashboard.
#
# Creates three things: a Postgres database, a FastAPI web service, and a weekly
# cron job that appends the latest completed week from every live source.
#
# Secrets are NEVER in this file. Every credential is declared `sync: false`,
# which makes Render prompt for it in the dashboard at deploy time (or you set
# it under the env group). Nothing sensitive is committed to the repo.
#
# After the first deploy, set the values in the "spi-secrets" env group:
#   TEAM_PASSWORD, CLINIKO_API_KEY, CLINIKO_USER_AGENT,
#   GOOGLE_ADS_* (6 values), META_* (5 values).
# SECRET_KEY is generated automatically; DATABASE_URL is wired from the DB.

databases:
  - name: spi-dashboard-db
    databaseName: spi_dashboard
    user: spi
    plan: free          # NOTE: Render's free Postgres expires ~30 days; bump to
                        # "basic-256mb" (or higher) for the live, long-lived deploy.

# Shared env group so the web service and the cron job read identical secrets.
# fromDatabase / generated values can't live in a group, so those stay per-service.
envVarGroups:
  - name: spi-secrets
    envVars:
      # --- auth ---
      - key: TEAM_PASSWORD
        sync: false
      # --- per-source live switches (already verified live) ---
      - key: CLINIKO_LIVE
        value: "true"
      - key: GOOGLE_ADS_LIVE
        value: "true"
      - key: YOUTUBE_LIVE
        value: "true"
      - key: META_LIVE
        value: "true"
      # --- Cliniko ---
      - key: CLINIKO_API_KEY
        sync: false
      - key: CLINIKO_USER_AGENT
        sync: false
      # --- Google Ads / YouTube (same account) ---
      - key: GOOGLE_ADS_DEVELOPER_TOKEN
        sync: false
      - key: GOOGLE_ADS_CLIENT_ID
        sync: false
      - key: GOOGLE_ADS_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ADS_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_ADS_LOGIN_CUSTOMER_ID
        sync: false
      - key: GOOGLE_ADS_CUSTOMER_ID
        sync: false
      # --- Meta (Facebook + Instagram) ---
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_AD_ACCOUNT_ID
        sync: false
      - key: META_SYSTEM_USER_TOKEN
        sync: false

services:
  # ---- FastAPI web service (serves API + static SPA) ----
  - type: web
    name: spi-dashboard
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - fromGroup: spi-secrets
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: spi-dashboard-db
          property: connectionString
      - key: SECRET_KEY          # signs the session cookie; generated, never seen
        generateValue: true
      - key: COOKIE_SECURE        # behind Render HTTPS
        value: "true"
      - key: SESSION_MAX_AGE
        value: "43200"
      # APP_NOW left UNSET so the live deploy uses the real system date.
      # (Set it only if you want to pin the demo clock.)

  # ---- Weekly snapshot refresh ----
  # Render has no FREE plan for cron jobs, so it's omitted to keep this deploy
  # at $0. The dashboard still shows live current-week numbers (fetched per
  # request). To auto-append completed weeks later, either:
  #   (a) add this back with `type: cron` + `plan: starter` (usage-billed, cents/mo), or
  #   (b) trigger `python -m app.jobs.weekly_refresh` from any external scheduler.
