# Render Blueprint — the SPI dashboard's DATA ENGINE.
#
# This deploys ONE free web service: a minimal FastAPI app (app.live_app) that
# exposes just two public, read-only endpoints the dashboard calls:
#     GET /api/new-patients   (Cliniko)
#     GET /api/ad-rows         (Google Ads + Meta + YouTube)
#
# The dashboard itself (the React UI) is hosted separately on Vercel; Vercel
# proxies its /api/* requests here via a rewrite, so the browser never talks to
# Render directly and there's no CORS to manage.
#
# Why Render and not "all on Vercel": the Cliniko crawl takes ~45s, which blows
# past Vercel's 10s serverless limit. Render runs a persistent server that can
# absorb it, and an in-process 30-min cache means it runs rarely.
#
# No database, no cron, no login here — the heavy full app (app.main) is left
# out of the deploy on purpose. Stays at $0.
#
# Secrets are NEVER in this file. Each credential is `sync: false`, so Render
# prompts for it in the dashboard at deploy time. Copy the values from your
# local backend/.env (which is gitignored and never pushed).

services:
  - type: web
    name: spi-data-engine
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.live_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # --- per-source live switches (already verified live) ---
      - key: CLINIKO_LIVE
        value: "true"
      - key: GOOGLE_ADS_LIVE
        value: "true"
      - key: YOUTUBE_LIVE
        value: "true"
      - key: META_LIVE
        value: "true"
      # --- Cliniko --- (copy from backend/.env)
      - key: CLINIKO_API_KEY
        sync: false
      - key: CLINIKO_USER_AGENT
        sync: false
      # --- Google Ads / YouTube (same account) ---
      - key: GOOGLE_ADS_DEVELOPER_TOKEN
        sync: false
      - key: GOOGLE_ADS_CLIENT_ID
        sync: false
      - key: GOOGLE_ADS_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ADS_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_ADS_LOGIN_CUSTOMER_ID
        sync: false
      - key: GOOGLE_ADS_CUSTOMER_ID
        sync: false
      # --- Meta (Facebook + Instagram) ---
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_AD_ACCOUNT_ID
        sync: false
      - key: META_SYSTEM_USER_TOKEN
        sync: false
